# 影像店营业 的移动端差异 其余区域沿用 assets/game_data/screen_info/random_play.yml
# 每天第一次打开经营画面会弹「昨日账本」 移动端认不出时脚本以为已进入经营画面
# 「开始营业」被弹窗挡住 识别营业状态超时失败（2026-11-05 第一次失败 关掉弹窗后再跑成功）
# 移动端还没拍到昨日账本 按同款大弹窗「周期挑战」的实拍位置推算：
# 标题在左上 x≈370-510 y≈175-220 红色 × 在右上 x≈1490-1595 y≈145-215 区域都留了余量
screen_id: random_play
area_list:
- area_name: 昨日账本
  pc_rect: [300, 110, 700, 260]
- area_name: 按钮-关闭
  pc_rect: [1350, 60, 1700, 300]

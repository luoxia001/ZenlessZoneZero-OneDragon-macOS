- area_name: 右侧选项区域
  pc_rect: [1340, 420, 1914, 700]
# 点单后的电量确认弹窗：移动端弹窗约放大 1.28 倍 按 PC 位置推算「确认」在 x≈1060 y≈740 附近（还没实拍）

# 地图 的移动端差异 其余区域沿用 assets/game_data/screen_info/map.yml
# 移动端地图是区域卡片网格（每行 3 张 区域名在卡片右下角） 当前区域的传送点排在画面底部一行
# 左上角红色返回箭头由 template_replace.yml 统一替换
screen_id: map
area_list:
- area_name: 主区域名称
  pc_rect: [0, 120, 1920, 880]
- area_name: 传送点名称
  pc_rect: [30, 995, 1890, 1052]
- area_name: 确认
  pc_rect: [980, 610, 1320, 690]

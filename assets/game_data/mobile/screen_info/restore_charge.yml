# 兑换数量、快捷使用等子态还没在移动端截到
screen_id: restore_charge
area_list:
- area_name: 标题-恢复电量
  pc_rect: [820, 300, 1100, 365]
- area_name: 确认
  pc_rect: [600, 800, 1320, 880]
- area_name: 取消
  pc_rect: [600, 800, 1320, 880]

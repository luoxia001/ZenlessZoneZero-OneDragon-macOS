# 迷失之地-大世界 的移动端差异 其余区域沿用 assets/game_data/screen_info/lost_void_normal_world.yml
# 左侧 LOOT 标签、左上角暂停按钮由 template_replace.yml 统一替换
# 对话框：比 PC 大 说话人名字在对话框上沿正中（y≈750） 对话内容在框内中间 右下角 >> 继续
screen_id: lost_void_normal_world
area_list:
- area_name: 区域-对话角色名称
  pc_rect: [860, 725, 1060, 780]
- area_name: 区域-对话内容
  pc_rect: [300, 820, 1620, 980]
# 右下交互按键变暗（附近没有可交互对象）：和战斗画面的「按键-交互」同一位置 换成移动端的暗色按键模板
# 挚交会谈层操控邦布 没有普攻按键 只能靠它判断已在大世界 识别不到会一直卡在等待加载
- area_name: 按键-交互-不可用
  pc_rect: [1465, 730, 1605, 870]
  template_sub_dir: mobile_lost_void
  template_id: btn_interact_disabled
# 判断「已走到交互目标旁」的图标尺寸：寻路时出现交互按键 且识别到的图标比这个尺寸大 才算到达
# 移动端界面缩放约 1.3 倍 图标更大：入口图标远处就有 55-58（PC 阈值 50 会一直满足）走到旁边 80-88；
# 感叹号远处 62-65 走到旁边 98-101。按 1.3 倍放大 PC 的 50/70
# 不放大时 路过已交互的角色（交互按键亮了）就会因为远处的入口图标够大而误判到达 反复停在半路
- area_name: 尺寸-到达-入口图标
  pc_rect: [0, 0, 65, 65]
- area_name: 尺寸-到达-感叹号图标
  pc_rect: [0, 0, 91, 91]

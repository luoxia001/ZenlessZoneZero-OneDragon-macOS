# 移动端（iOS / PlayCover）的触控布局
# 坐标都是 1920x1080 标准坐标 来自 PlayCover 16:9 窗口的实测截图
# 值为 null 的按键表示还没有测量位置 调用时只记录警告 不会点击

# 画面右下角 UID 的位置 截图后涂黑
uid_rect: [1650, 1052, 1810, 1080]

# 左下角虚拟摇杆 位置固定 不会跟随手指按下的位置
# 中心要和游戏画出的摇杆圆心一致 偏了的话往正前方推会变成斜着走 例如偏右 30 像素时向前走会偏右约 18 度
joystick:
  center: [394, 781]
  radius: 90  # 推出去的距离 游戏画出的摇杆内圈半径约 130 这里约推到 70%

# 拖动镜头的区域 避开摇杆和右侧按钮
camera:
  rect: [640, 150, 1400, 650]
  # PC 鼠标相对移动的像素 × scale = 触屏拖动的像素
  # 实测 匀速慢拖时约 1.09 度/像素；PC 默认 turn_dx 为 5.5 像素/度 所以 scale = 1 / (1.09 × 5.5) ≈ 0.167
  scale: 0.167
  # 触摸死区：手指移动不到这段距离时镜头不转 更短的拖动会先越过死区再退回
  slop: 8
  # 每次拖动最长的生效距离 更长的转向拆成多次 避免长距离拖动时转得过多
  max_stroke: 40

# 输入框右侧自带的粘贴按钮 没有辅助功能权限时用它把剪贴板里的文字粘贴进去
# 目前只有菜单里的兑换码输入框用到文字输入
text_paste_button: [1258, 572]

# 动作名和 GameKeyAction 一致 写 [x, y] 是点按 写 [x, y, dx, dy] 是滑动
buttons:
  normal_attack: [1535, 800]
  special_attack: [1376, 893]
  ultimate: [1693, 523]
  dodge: [1693, 893]
  switch_next: [1693, 709]
  # iOS 只有一个切人按钮：点一下切到下一个 往任意方向滑一下切到上一个（实测上滑 / 下滑 / 左滑都是上一个）
  switch_prev: [1693, 709, 0, -120]  # 写成 [x, y, dx, dy] 表示从 (x, y) 滑动 (dx, dy)
  interact: [1535, 800]  # 大世界里同一个位置是交互按钮
  switch_backup: [1375, 705]  # 切换后援 矩阵行动里协战代理人的按钮
  chain_left: [358, 878]  # 连携技 点倒计时条左边的头像
  chain_right: [1562, 878]  # 连携技 点倒计时条右边的头像
  chain_cancel: [960, 420]  # 取消连携技 游戏提示「双击空白区域取消」 这个动作会双击
  lock: null
